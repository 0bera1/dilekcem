name: Live smoke

# The site is deployed to Cloudflare Pages from a developer machine with `npm run deploy`
# (no Cloudflare credentials are stored in CI). This workflow checks the live site on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  SITE_URL: https://dilekcem.beraekimci.com.tr

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke tests against the live site
        run: npm run test:e2e:smoke
        env:
          BASE_URL: ${{ env.SITE_URL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
